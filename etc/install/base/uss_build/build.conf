# CBSA Build Configuration
# This file contains environment variables for the USS-based build system

# High Level Qualifiers
HLQ=CBSA
BANK_PREFIX=${HLQ}.CICSBSA

# CICS Configuration
CICS_HLQ=DFH560.CICS
CICS_REGION=CICSTS61

# DB2 Configuration
DB2_HLQ=DSNC10
DB2_SUBSYSTEM=DBCG
DB2_OWNER=IBMUSER
DB2_PLAN=CBSA
DB2_PACKAGE=PCBSA
DB2_DSNTEP_PLAN=DSNTEP2
DB2_DSNTEP_LOADLIB=${DB2_HLQ}.RUNLIB
DB2_VCAT=DSNV12DP

# COBOL Configuration
COBOL_HLQ=IGY630

# Language Environment
LE_HLQ=CEE

# Library Names
JCL_INSTALL=${HLQ}.JCL.INSTALL
DB2_JCL_INSTALL=${HLQ}.DB2.JCL.INSTALL
BUILD_JCL=${BANK_PREFIX}.BUILDJCL
LOADLIB=${BANK_PREFIX}.LOADLIB
DBRM=${BANK_PREFIX}.DBRM
LKED=${BANK_PREFIX}.LKED
BMS=${BANK_PREFIX}.BMS
ASM=${BANK_PREFIX}.ASM
CBSAMOD=${BANK_PREFIX}.CBSAMOD
COBOL=${BANK_PREFIX}.COBOL
DSECT=${BANK_PREFIX}.DSECT

# VSAM Files
ABNDFILE=${BANK_PREFIX}.ABNDFILE
CUSTOMER=${BANK_PREFIX}.CUSTOMER

# z/OS Connect Configuration
ZOSCONNECT_APIS=/var/zosconnect/v3r0/servers/defaultServer/resources/zosconnect/apis
ZOSCONNECT_SERVICES=/var/zosconnect/v3r0/servers/defaultServer/resources/zosconnect/services
ZOSCONNECT_HTTP_PORT=30701
ZOSCONNECT_HTTPS_PORT=30702
ZOSCONNECT_CICS_PORT=30709

# User Configuration
BANK_USER=CICSUSER
SUBMIT_USER=${USER}

# Build Options
COMPILE_PARALLEL=4
VERBOSE=false

